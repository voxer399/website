<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var palette = localStorage.getItem("theme-palette") || "classic";
          var mode = localStorage.getItem("theme-mode") || "system";
          var resolved = mode === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          var root = document.documentElement;
          root.setAttribute("data-palette", palette);
          root.setAttribute("data-mode", resolved);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <meta name="view-transition" content="same-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Andrea Forán, Psychologist</title>
    <meta name="description" content="Get in touch with Andrea Forán by email, phone, or book an online consultation directly via Calendly." />
    <link rel="icon" href="/assets/images/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/images/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-contact.tsx"></script>
  </body>
</html>
