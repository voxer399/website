<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script>
      (function () {
        try {
          var palette = localStorage.getItem("theme-palette") || "classic";
          var mode = localStorage.getItem("theme-mode") || "system";
          var resolved = mode === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          var root = document.documentElement;
          root.setAttribute("data-palette", palette);
          root.setAttribute("data-mode", resolved);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <meta name="view-transition" content="same-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="page-transition-overlay" class="is-visible" aria-hidden="true">
      <img src="assets/images/favicon-180.png" alt="" />
    </div>
    <script>
      (function () {
        var overlay = document.getElementById("page-transition-overlay");
        if (!overlay) return;

        setTimeout(function () {
          overlay.classList.remove("is-visible");
        }, 450);

        document.addEventListener(
          "click",
          function (e) {
            if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            var a = e.target.closest("a");
            if (!a || !a.href || a.target === "_blank" || a.hasAttribute("download")) return;
            var url;
            try {
              url = new URL(a.href, window.location.href);
            } catch (err) {
              return;
            }
            if (url.origin !== window.location.origin) return;
            if (url.pathname === window.location.pathname && url.hash) return;
            if (!/\.html?$/.test(url.pathname)) return;

            e.preventDefault();
            overlay.classList.add("is-visible");
            setTimeout(function () {
              window.location.href = a.href;
            }, 450);
          },
          true,
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/entry-program.tsx"></script>
  </body>
</html>
