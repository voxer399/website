name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/install-uiux-pro-max-skill-s5gfba", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html about.html how-i-work.html program.html prices.html contact.html _site/
          cp -r assets _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
